site_name: Ülgen
site_url: https://mftnakrsu.github.io/ulgen/
site_description: EVREN for the coding tools you already use
repo_url: https://github.com/mftnakrsu/ulgen
repo_name: mftnakrsu/ulgen
edit_uri: edit/main/docs/
docs_dir: docs

exclude_docs: |
  design.md
  release.md
  requirements.txt
  assets/demo.tape

hooks:
  - mkdocs_hooks.py

nav:
  - Home: index.md
  - Install: install.md
  - Using Ülgen: using.md
  - EVREN: evren.md
  - Türkçe: tr/evren-ile-kodlama-araclari.md

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra:
  generator: false
  alternate:
    - name: English
      link: /ulgen/
      lang: en
    - name: Türkçe
      link: /ulgen/tr/evren-ile-kodlama-araclari/
      lang: tr

copyright: This site follows the main branch.

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

validation:
  omitted_files: warn
  absolute_links: ignore
  unrecognized_links: warn
  anchors: warn
