# The workflows' actions are pinned by commit; Dependabot proposes the new
# commit when an action makes a release, as one pull request a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # cosign-installer 4 installs cosign 3, which signs in a newer bundle
      # format; see "Signing" in docs/release.md before moving.
      - dependency-name: sigstore/cosign-installer
        update-types:
          - version-update:semver-major
